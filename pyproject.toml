[project]
name = "shelf"
version = "0.5.0"
description = "書籍・資料コーパスへの委譲QA（ローカル検索+サブスクCLI合成）MCPサーバ"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "anyio>=4.1",
    "fastembed>=0.4.0",
    "numpy>=1.26",
    "pymupdf4llm>=1.28.0",
    "pymupdf>=1.28.0",
    "markitdown[docx,xlsx,xls,pptx]",
]

[project.scripts]
shelf = "shelf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shelf"]

[tool.ruff]
line-length = 100
target-version = "py311"

# ruff 0.16.0 でデフォルトの有効ルールが拡大されたため、従来のデフォルトを明示して固定する。
# I（isort）/B（bugbear）は CI/lint 強化タスクで採用済み。他の新ルール群の採用は別タスクで判断する。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

# distill/extract.py は agent-recall 由来の共有資産のため、整形のみの diff が
# 上流との同期ノイズになる import 並べ替え（I）を適用しない。
[tool.ruff.lint.per-file-ignores]
"distill/extract.py" = ["I"]

# pytest: SWIG 由来（pymupdf）の DeprecationWarning は外部ライブラリ由来で対処不能のため ignore。
# それ以外の DeprecationWarning は検出・修正対象。
[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

# エディタ(Pyright)が shelf/.venv を解決できるようにする（実行系は uv が解決）
# include を shelf/ に絞る: tests/ は FakeLibrarian 等 Protocol の構造的型付けに
# 由来する既知のノイズが多く、CI の型チェック対象は本体コードに限定する。
[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["shelf"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.0",
    "ruff>=0.16.0",
]
