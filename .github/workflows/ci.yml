name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run ruff check .

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # リポジトリ直下の .gitleaks.toml（tests/ 配下のダミー秘密情報フィクスチャの
      # allowlist）は、gitleaks-action が --config を渡さない場合に gitleaks CLI 自身が
      # target path 直下から自動検出する既定挙動（公式README「order of precedence」の
      # 4番目）に従うため、config パス指定は不要。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
