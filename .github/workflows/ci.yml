name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run ruff check .
      # pyright は静的型チェックのため実行時の Python バージョン差では結果が
      # 変わらない。4組合せ全てで走らせるのは実行コストの無駄なので、
      # requires-python の下限（3.11）× ubuntu の1点だけに絞る。
      - name: pyright（型チェック）
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run pyright shelf/

  # ruleset の必須チェックは context 名 "test" を要求するが、matrix 化により
  # 実チェック名は "test-matrix (os, python-version)" になり永久に報告されなくなる
  # （PR #13 で BLOCKED を実測）。matrix 全体の成否を単一 context "test" へ集約して報告する。
  test:
    needs: test-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: matrix 全 OS の結果を集約する
        run: |
          if [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "test-matrix result: ${{ needs.test-matrix.result }}"
            exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # リポジトリ直下の .gitleaks.toml（tests/ 配下のダミー秘密情報フィクスチャの
      # allowlist）は、gitleaks-action が --config を渡さない場合に gitleaks CLI 自身が
      # target path 直下から自動検出する既定挙動（公式README「order of precedence」の
      # 4番目）に従うため、config パス指定は不要。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
